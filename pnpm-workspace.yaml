allowBuilds:
  # msw's postinstall only prints an advisory notice. The piece that actually
  # matters, public/mockServiceWorker.js, is installed explicitly by the
  # `msw:init` script in package.json.
  msw: false
  # tesseract.js' only install script is `opencollective-postinstall`, a
  # donation banner. Nothing about the WASM core or the OCR models depends on
  # it, so there is no reason to let it run.
  tesseract.js: false
